
services:
  mc-modpack-installer:
    mem_limit: 512m
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile.modinstaller
    volumes:
      - ./modpack:/modpack
      - ./pack.mrpack:/modpack/pack.mrpack
      - ./data:/data
      - ./scripts:/scripts
    environment:
      MODRINTH_URL: ${MODRINTH_URL:-https://cdn.modrinth.com/data/Jkb29YJU/versions/X4JhlFiB/COBBLEVERSE%201.3.3.mrpack}
      SERVER_WORLDNAME: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
    entrypoint: ["/bin/sh", "/scripts/install-modpack.sh"]


  mc:
    mem_limit: 8G
    build:
      context: .
      dockerfile: Dockerfile.mc
    init: true
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-UTC}
      EULA: "true"
      TYPE: "FABRIC"
      VERSION: "1.21.1"
      FABRIC_LOADER_VERSION: "0.17.3"
      FABRIC_LAUNCHER_VERSION: "1.0.3"
      MEMORY: "6G"
      SERVER_WORLDNAME: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
      LEVEL: ${SERVER_WORLDNAME:-MY_COBBLEVERSE_WORLD}
      ENABLE_WHITELIST: "false"
      DEBUG: ${DEBUG:-False}
      SERVER_NAME: ${SERVER_NAME:-Cobbleverse}
      MOTD: ${SERVER_MOTD:-My Server}
      ICON: ${SERVER_ICON:-}
      ALLOW_FLIGHT: ${ALLOW_FLIGHT:-False}
      SPAWN_MONSTERS: ${SPAWN_MONSTERS:-False}
      JAVA_VERSION: 21

    volumes:
      - ./modpack:/modpack
      - ./pack.mrpack:/modpack/pack.mrpack
      - ./data:/data
      - ./worlds:/data/worlds
      - ./scripts/wait-for-modpack.sh:/wait-for-modpack.sh
      - ./scripts/server:/server-scripts
      - ./backup:/backup
    entrypoint: ["/bin/sh", "/wait-for-modpack.sh"]

    command: []
    ports:
      - "25565:25565"
    depends_on:
      - mc-modpack-installer
    restart: on-failure
